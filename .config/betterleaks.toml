# betterleaks config — https://github.com/betterleaks/betterleaks
# gitleaks-compatible secret scanner. Keep the built-in rules; add allowlist entries
# below for confirmed false positives (example keys, test fixtures) instead of disabling.

[extend]
useDefault = true

# The whole block stays commented: an [allowlist] with no entries is a hard config error.
# Uncomment it together with at least one entry.
# [allowlist]
# paths = [
#   '''src/workflow/.*''',
# ]
# regexes = [
#   '''EXAMPLE_[A-Z0-9]+''',
# ]
# stopwords = [
#   "example",
#   "sample",
# ]
