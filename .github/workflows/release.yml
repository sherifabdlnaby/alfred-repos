name: Release
# PR merge → semver tag → build .alfredworkflow → checksum + attest → publish release
# PR labels control version bump: major, minor, patch (default), skip-release
# Manual trigger also supported via workflow_dispatch (with optional draft mode)
on:
  push:
    branches:
      - main
  pull_request:
    # edited: re-apply title-regex labels on retitle; labeled/unlabeled: re-run the bump gate/preview
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.3). Leave empty to auto-detect from last PR."
        required: false
        type: string
      draft:
        description: "Keep as draft release after all artifacts are built."
        required: false
        type: boolean
        default: false
# Default to read-only; each job opts into the writes it actually needs.
permissions:
  contents: read
# Release runs queue WHOLE (version + release), so back-to-back merges compute their tags serially —
# unqueued version jobs would read the same latest tag and collide on it. PR runs (autolabel) keep
# per-PR cancel-superseded. Caveat: GitHub keeps at most ONE pending run per group, so on rapid merges
# a superseded pending run is dropped; its changes still land in the next release's notes, but its
# bump label isn't consumed (re-run the dropped run from the UI if that bump mattered).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('autolabel-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # ── Autolabel PRs + bump gate/preview ──────────────────────────────
  autolabel:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # release-drafter labels the PR + the sticky bump preview comment
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # tags, so the bump preview can compute the next version
          persist-credentials: false
      - uses: release-drafter/release-drafter@09c613e259eb8d4e7c81c2cb00618eb5fc4575a7 # v5.25.0
        with:
          config-name: auto-release.yml
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Bump gate + version preview: one sticky comment shows the exact tag a merge would cut,
      # recomputed on every label change; no bump label fails the job (make it a required check to
      # enforce — release runs still fall back to `patch` if an unlabeled PR merges anyway).
      - name: Bump gate & version preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }} # via env, never interpolated (zizmor: template-injection)
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER="<!-- bump-preview -->"
          # Keep in sync with the release job's "Refresh bump previews" step.
          last_stable() { git tag -l 'v*' --sort=-v:refname | grep -v '-' | head -1 || true; }
          next_version() { # $1 = bump
            PREV="$(last_stable)"; [ -z "$PREV" ] && PREV="v0.0.0"
            IFS='.' read -r MA MI PA <<< "${PREV#v}"
            case "$1" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              *)     PA=$((PA + 1)) ;;
            esac
            echo "v${MA}.${MI}.${PA}"
          }
          bump_of() { # exact label match, precedence skip > major > minor > patch
            case ",$1," in
              *,skip-release,*) echo skip ;;
              *,major,*) echo major ;;
              *,minor,*) echo minor ;;
              *,patch,*) echo patch ;;
              *) echo "" ;;
            esac
          }
          PREV="$(last_stable)"; [ -z "$PREV" ] && PREV="v0.0.0"
          BUMP="$(bump_of "$LABELS")"
          # Preview as a table; the marker stays first so the sticky-comment lookup still matches.
          case "$BUMP" in
            skip) ROW="| \`$PREV\` | \`skip-release\` | — no release |"; NOTE="" ;;
            "")   ROW="| \`$PREV\` | ⚠️ none | \`patch\` fallback → **\`$(next_version patch)\`** |"
                  NOTE="> ⚠️ No bump label (\`major\`/\`minor\`/\`patch\`/\`skip-release\`) — the gate fails; an unlabeled merge falls back to \`patch\`." ;;
            *)    ROW="| \`$PREV\` | \`$BUMP\` | **\`$(next_version "$BUMP")\`** |"; NOTE="" ;;
          esac
          BODY="$MARKER"$'\n'"### 🔖 Release preview"$'\n\n'"| Current | Bump | On merge |"$'\n'"|:--|:--|:--|"$'\n'"$ROW"
          [ -n "$NOTE" ] && BODY="$BODY"$'\n\n'"$NOTE"
          CID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "map(select(.body|startswith(\"$MARKER\")))[0].id // empty" || true)"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" >/dev/null \
              || echo "::warning::could not update the preview comment (fork PR?)"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null \
              || echo "::warning::could not post the preview comment (fork PR?)"
          fi
          if [ -z "$BUMP" ]; then
            echo "::error::No bump label (major/minor/patch/skip-release) on this PR — add one; an unlabeled merge falls back to patch."
            exit 1
          fi
  # ── Determine version ──────────────────────────────────────────────
  version:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads git history + PR metadata
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      version: ${{ steps.version.outputs.version }}
      pr_number: ${{ steps.pr.outputs.number }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find merged PR and determine bump
        if: github.event_name == 'push'
        id: pr
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PR_JSON=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | .[0] // empty' 2>/dev/null || echo "")

          if [ -z "$PR_JSON" ]; then
            echo "No merged PR found for commit ${SHA}, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUM=$(echo "$PR_JSON" | jq -r '.number')
          LABELS=$(echo "$PR_JSON" | jq -r '[.labels[].name] | join(",")')
          echo "number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"
          echo "Found merged PR #$PR_NUM with labels: $LABELS"

          # Exact label match (grep -w would also hit e.g. `major-redesign`).
          # Precedence skip-release > major > minor > patch; default patch.
          case ",${LABELS}," in
            *,skip-release,*) echo "skip=true"  >> "$GITHUB_OUTPUT"; exit 0 ;;
            *,major,*)        echo "bump=major" >> "$GITHUB_OUTPUT" ;;
            *,minor,*)        echo "bump=minor" >> "$GITHUB_OUTPUT" ;;
            *)                echo "bump=patch" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Compute next version
        if: >-
          (github.event_name == 'push' && steps.pr.outputs.skip != 'true') || github.event_name == 'workflow_dispatch'
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }} # user-controllable; via env, never interpolated into the shell (zizmor: template-injection)
          LABEL_BUMP: ${{ steps.pr.outputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            NEW_TAG="$INPUT_VERSION"
            [[ "$NEW_TAG" != v* ]] && NEW_TAG="v${NEW_TAG}"
            echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
            echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "Manual release: $NEW_TAG"
            exit 0
          fi

          # Bump source: PR label (push) or default patch (dispatch without explicit version).
          BUMP="${LABEL_BUMP:-patch}"

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v '-' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Previous tag: $LATEST_TAG"

          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH%%-*}"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "Version bump: $BUMP ($LATEST_TAG -> $NEW_TAG)"
  # ── Build and release ──────────────────────────────────────────────
  release:
    needs: version
    if: needs.version.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag + create the GitHub release
      id-token: write # keyless attestation (OIDC)
      attestations: write # provenance for the bundle
      pull-requests: write # comment the release link back on the PR
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # zizmor: ignore[artipacked] -- this job pushes the release tag, so it needs the checkout credentials persisted
      - name: Create and push tag
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists, skipping"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          install_args: "--locked" # honor mise.lock
          cache: false # one-shot release build; no cache to reuse and a poisoned cache would taint the artifact (zizmor: cache-poisoning)
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # so tool installs don't hit API rate limits
      - name: Build .alfredworkflow
        env:
          VERSION: ${{ needs.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          # Same build task local dev runs; --version stamps the tag into info.plist.
          mise run build --version "${VERSION}"
          # Checksum the bundle so a downloader can verify it against the attestation.
          ( cd build && sha256sum ./*.alfredworkflow > checksums.txt )
      # Provenance for the published bundle (subject-path covers the bundle + checksums). The
      # principle is artifact-agnostic: a bundle pulled from a Release gets attested just like an image.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "build/*"
      - name: Create release with artifacts
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          args=(--title "$TAG" --generate-notes)
          # --latest only for a non-draft release (a draft isn't "latest" until published).
          if [ "$DRAFT" = true ]; then args+=(--draft)
          else args+=(--latest); fi
          gh release create "$TAG" build/* "${args[@]}"
      # Generated notes say what changed; append a footer telling consumers how to install and verify
      # the bundle. Per-repo install steps live in .github/release-footer.md; the Verify block is
      # generated. Idempotent via a marker.
      - name: Append Install + Verify footer to the release notes
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BODY="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)"
          case "$BODY" in *'<!-- verify-footer -->'*) echo "footer already present"; exit 0 ;; esac
          INSTALL=""
          [ -f .github/release-footer.md ] && INSTALL="$(printf '\n\n%s' "$(cat .github/release-footer.md)")"
          VERIFY="$(printf '%s\n' '' '<!-- verify-footer -->' '---' '## Verify' '' \
            'Assets are provenance-attested and checksummed — confirm before use:' '' \
            '```bash' \
            "gh attestation verify <asset> --repo $REPO" \
            'sha256sum --check checksums.txt' \
            '```')"
          gh release edit "$TAG" --repo "$REPO" --notes "${BODY}${INSTALL}${VERIFY}"
      - name: Comment on PR
        if: github.event_name == 'push' && needs.version.outputs.pr_number != ''
        env:
          TAG: ${{ needs.version.outputs.new_tag }}
          PR_NUMBER: ${{ needs.version.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body "🚀 **Release ${TAG}** published: https://github.com/${REPO}/releases/tag/${TAG}

          Verify the bundle's provenance before installing:
          \`\`\`
          gh attestation verify alfred-repos-${TAG}.alfredworkflow --owner sherifabdlnaby
          \`\`\`"
      # The base version just moved, so open PRs' bump previews are stale — recompute them. Updates
      # existing preview comments only; a PR gets its first one from its own PR events (autolabel job).
      - name: Refresh bump previews on open PRs
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER="<!-- bump-preview -->"
          # Keep in sync with the autolabel job's "Bump gate & version preview" step.
          last_stable() { git tag -l 'v*' --sort=-v:refname | grep -v '-' | head -1 || true; }
          next_version() { # $1 = bump
            PREV="$(last_stable)"; [ -z "$PREV" ] && PREV="v0.0.0"
            IFS='.' read -r MA MI PA <<< "${PREV#v}"
            case "$1" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              *)     PA=$((PA + 1)) ;;
            esac
            echo "v${MA}.${MI}.${PA}"
          }
          bump_of() {
            case ",$1," in
              *,skip-release,*) echo skip ;;
              *,major,*) echo major ;;
              *,minor,*) echo minor ;;
              *,patch,*) echo patch ;;
              *) echo "" ;;
            esac
          }
          gh pr list --state open --json number --jq '.[].number' | while read -r NUM; do
            CID="$(gh api "repos/$REPO/issues/$NUM/comments" \
              --jq "map(select(.body|startswith(\"$MARKER\")))[0].id // empty")"
            [ -z "$CID" ] && continue
            LABELS="$(gh api "repos/$REPO/issues/$NUM/labels" --jq 'map(.name) | join(",")')"
            PREV="$(last_stable)"; [ -z "$PREV" ] && PREV="v0.0.0"
            BUMP="$(bump_of "$LABELS")"
            case "$BUMP" in
              skip) ROW="| \`$PREV\` | \`skip-release\` | — no release |"; NOTE="" ;;
              "")   ROW="| \`$PREV\` | ⚠️ none | \`patch\` fallback → **\`$(next_version patch)\`** |"
                    NOTE="> ⚠️ No bump label (\`major\`/\`minor\`/\`patch\`/\`skip-release\`) — the gate fails; an unlabeled merge falls back to \`patch\`." ;;
              *)    ROW="| \`$PREV\` | \`$BUMP\` | **\`$(next_version "$BUMP")\`** |"; NOTE="" ;;
            esac
            BODY="$MARKER"$'\n'"### 🔖 Release preview"$'\n\n'"| Current | Bump | On merge |"$'\n'"|:--|:--|:--|"$'\n'"$ROW"
            [ -n "$NOTE" ] && BODY="$BODY"$'\n\n'"$NOTE"
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" >/dev/null
          done
